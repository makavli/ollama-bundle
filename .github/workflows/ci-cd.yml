name: CI/CD - Validate & Deploy WebUI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Scripts & Syntax

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install validation tools
        run: |
          pip install pylint flake8 black
          apt-get update && apt-get install -y shellcheck
      
      - name: Validate Python syntax
        run: |
          python -m py_compile installer/setup_all.py
          python -m py_compile ollama-cli/lib/client.py
          python -m py_compile ollama-cli/src/ollama_vs_code.py
        continue-on-error: true
      
      - name: Lint Python files
        run: |
          flake8 installer/setup_all.py --max-line-length=120 --ignore=E501,W503
          flake8 ollama-cli/ --max-line-length=120 --ignore=E501,W503
        continue-on-error: true
      
      - name: Validate shell scripts
        run: |
          shellcheck installer/prepare_install.sh
          shellcheck installer/install_nvidia_driver.sh
          shellcheck installer/runGUI.sh
          shellcheck installer/setup_vs_code_ai.sh
        continue-on-error: true

  build-webui:
    runs-on: ubuntu-latest
    name: Build & Test WebUI Image
    needs: validate

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build WebUI image
        run: |
          docker build \
            --target base \
            --tag ollama-bundle:webui-latest \
            --build-arg OLLAMA_URL=http://localhost:11434 \
            - <<EOF
          FROM ghcr.io/open-webui/open-webui:main AS base
          LABEL app="ollama-bundle-webui"
          LABEL description="OpenWebUI container for Ollama local LLMs"
          EOF
        continue-on-error: true
      
      - name: Test WebUI container startup (dry-run)
        run: |
          echo "WebUI Docker image ready for deployment"
          echo "To run locally: docker run -d --name open-webui -p 3000:8080 -e OLLAMA_BACKEND=http://host.docker.internal:11434 ghcr.io/open-webui/open-webui:main"

  deploy-webui:
    runs-on: ubuntu-latest
    name: Deploy WebUI
    needs: build-webui
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Start WebUI on push to main
        run: |
          echo "✓ WebUI deployment triggered"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "WebUI will be available at:"
          echo "  - Local: http://localhost:3000"
          echo "  - Ollama Backend: http://host.docker.internal:11434"
      
      - name: Generate deployment info
        run: |
          cat > deployment-info.txt <<EOF
          Ollama Bundle - WebUI Deployment Info
          ======================================
          Deployed at: $(date)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref }}
          
          To start WebUI locally:
          1. Pull latest: git pull origin main
          2. Run setup: bash installer/runGUI.sh
          3. Access: http://localhost:3000
          
          For production deployment:
          1. Ensure Ollama is running: sudo systemctl start ollama
          2. Deploy WebUI: python3 installer/setup_all.py
          3. Monitor: docker ps
          EOF
          cat deployment-info.txt
      
      - name: Upload deployment info
        uses: actions/upload-artifact@v3
        with:
          name: deployment-info
          path: deployment-info.txt

  test-cli:
    runs-on: ubuntu-latest
    name: Test Ollama CLI
    needs: validate

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Test CLI imports
        run: |
          cd ollama-cli
          python -c "from lib.client import OllamaClient; print('✓ CLI client imported successfully')" || true
      
      - name: Validate CLI arguments
        run: |
          python ollama-cli/src/ollama_vs_code.py --help | head -20
        continue-on-error: true

  summary:
    runs-on: ubuntu-latest
    name: CI/CD Summary
    needs: [validate, build-webui, test-cli]
    if: always()

    steps:
      - name: Workflow Summary
        run: |
          echo "Ollama Bundle CI/CD Pipeline Summary"
          echo "======================================"
          echo "✓ Python syntax validation: ${{ needs.validate.result }}"
          echo "✓ Shell script validation: ${{ needs.validate.result }}"
          echo "✓ WebUI image build: ${{ needs.build-webui.result }}"
          echo "✓ CLI tests: ${{ needs.test-cli.result }}"
          echo ""
          echo "Next steps:"
          echo "1. Monitor workflow at: https://github.com/${{ github.repository }}/actions"
          echo "2. View logs for any failures"
          echo "3. Deploy WebUI when main branch passes all checks"
