name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python & shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - name: flake8
        run: flake8 installer/ ollama-cli/ --max-line-length=120
      - name: shellcheck
        run: shellcheck installer/*.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install requests
      - name: CLI tests
        run: python -m unittest discover -s ollama-cli/tests -v
      - name: Installer tests
        run: python -m unittest discover -s installer -p "test_*.py" -v
      - name: CLI --help works
        run: python ollama-cli/src/ollama_vs_code.py --help

  webui-image:
    name: Build WebUI image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile.webui
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.webui
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
